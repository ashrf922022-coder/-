name: Gemini PR Reviewer & Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/gemini')) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: google-gemini/gemini-cli-action@v1
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
