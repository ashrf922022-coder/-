plugins { id 'com.android.application' }

android {
    namespace 'com.awridi.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.awridi.ai'
        minSdk 23
        targetSdk 35
        versionCode 31
        versionName '3.1'
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
